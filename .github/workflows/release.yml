name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    name: Build macOS binary
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/mlx-model-picker dist/
          tar -C dist -czf mlx-model-picker-macos.tar.gz mlx-model-picker
      - uses: softprops/action-gh-release@v2
        with:
          files: mlx-model-picker-macos.tar.gz
